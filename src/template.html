<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="4 savants">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<title>Nos savants sont des nains sur des épaules de géants</title>
<style>
@font-face{font-family:'Fredoka';font-weight:500;src:url(data:font/woff2;base64,__F500__) format('woff2');}
@font-face{font-family:'Fredoka';font-weight:600;src:url(data:font/woff2;base64,__F600__) format('woff2');}
@font-face{font-family:'Fredoka';font-weight:700;src:url(data:font/woff2;base64,__F700__) format('woff2');}
:root{--ink:#0b0820;--night:#120d33;--gold:#ffd84a;--cream:#ffe39a;--lav:#c9c4e8;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--ink);font-family:Fredoka,"Trebuchet MS",sans-serif;color:#fff;}
button{font-family:inherit;cursor:pointer;}

/* ---------------- home ---------------- */
#home{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;z-index:10;
  background:radial-gradient(ellipse at 50% -10%,#2b2a7a 0%,#17135a 30%,#0d0a2e 62%,#07051a 100%);}
#home.hide{display:none;}
#sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.wrap{position:relative;max-width:1280px;margin:0 auto;padding:max(12px,2vh) 28px max(14px,2.4vh);min-height:100%;display:flex;flex-direction:column;}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.kicker{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(11px,1.7vh,14px);color:var(--lav);}
.langsw{display:inline-flex;border-radius:99px;padding:4px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.25);}
.langsw button{border:0;border-radius:99px;background:transparent;color:#fff;font-weight:700;font-size:clamp(13px,1.9vh,16px);padding:.45em 1.1em;}
.langsw button.on{background:var(--gold);color:#1b1446;}
.hero{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2vw;}
.hero h1{margin:0;font-size:clamp(28px,min(4.6vw,6.6vh),64px);line-height:1.04;font-weight:700;letter-spacing:-.01em;text-shadow:0 4px 0 #1b1446,0 10px 30px rgba(0,0,0,.45);}
.hero h1 em{font-style:normal;color:var(--gold);}
.quote{margin:1.7vh 0 0;font-size:clamp(13px,min(1.35vw,2vh),18px);font-weight:500;color:var(--cream);line-height:1.42;max-width:660px;}
.quote small{display:block;margin-top:.5vh;color:var(--lav);font-size:.85em;}
.intro{margin:1.4vh 0 0;font-size:clamp(13px,min(1.3vw,1.95vh),17px);font-weight:500;line-height:1.45;color:#e8e6ff;max-width:660px;}
.more{margin-top:1.8vh;border:1.5px solid rgba(255,216,74,.6);background:rgba(255,216,74,.1);color:var(--gold);font-weight:700;font-size:clamp(13px,1.9vh,16px);padding:.5em 1.15em;border-radius:99px;}
.more:hover{background:rgba(255,216,74,.22);}
.heroimg{position:relative;display:flex;justify-content:center;align-items:center;padding:0 clamp(90px,9vw,150px);}
.heroimg img{height:clamp(170px,min(50vh,62vw),560px);filter:drop-shadow(0 18px 30px rgba(0,0,0,.55));}
.herofig{position:relative;display:inline-block;line-height:0;}
.hl{position:absolute;transform:translateY(-50%);white-space:nowrap;line-height:1.2;font-weight:700;font-size:clamp(11px,min(1.1vw,1.7vh),15px);background:rgba(11,8,32,.82);color:var(--cream);padding:.3em .8em;border-radius:99px;border:1px solid rgba(255,216,74,.45);}
.hl.l{right:calc(100% + 4px);} .hl.r{left:calc(100% + 4px);}
.hl:after{content:"";position:absolute;top:50%;width:14px;border-top:1.5px dashed rgba(255,216,74,.6);} .hl.l:after{left:100%;} .hl.r:after{right:100%;}
.heroimg .ground{position:absolute;bottom:-6px;left:10%;right:10%;height:28px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,216,74,.25),transparent 70%);}
.cards{flex:none;margin-top:2vh;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;--rise:1.3vh;align-items:end;}
.card{position:relative;border:0;padding:0;text-align:left;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
  border:1.5px solid rgba(255,255,255,.16);border-radius:20px;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s;box-shadow:0 14px 34px rgba(0,0,0,.35);}
.card:nth-child(1){margin-bottom:0;} .card:nth-child(2){margin-bottom:var(--rise);} .card:nth-child(3){margin-bottom:calc(var(--rise)*2);} .card:nth-child(4){margin-bottom:calc(var(--rise)*3);}
.card:hover,.card:focus-visible{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 20px 44px rgba(0,0,0,.5),0 0 0 3px rgba(255,216,74,.25);outline:none;}
.thumb{height:clamp(84px,16vh,200px);background:#1b2260 center/cover no-repeat;position:relative;}
.thumb .date{position:absolute;left:10px;top:10px;background:rgba(11,8,32,.82);color:var(--gold);font-weight:700;font-size:clamp(12px,1.7vh,15px);padding:.3em .8em;border-radius:99px;}
.thumb .play{position:absolute;right:10px;bottom:10px;width:clamp(32px,5vh,46px);height:clamp(32px,5vh,46px);border-radius:50%;background:var(--gold);color:#1b1446;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .2s;}
.thumb .play svg{width:55%;height:55%;}
.card:hover .play{transform:scale(1.12);}
.cbody{padding:1.1vh 14px 1.3vh;}
.cname{font-size:clamp(16px,min(1.7vw,2.6vh),23px);font-weight:700;line-height:1.1;}
.cq{margin-top:.4vh;font-size:clamp(12px,min(1.15vw,1.85vh),15px);font-weight:500;color:var(--cream);line-height:1.3;min-height:2.6em;}
.cmeta{margin-top:.6vh;font-size:clamp(11px,1.6vh,13px);font-weight:600;color:var(--lav);display:flex;gap:10px;flex-wrap:wrap;}
.modal{position:fixed;inset:0;z-index:30;background:rgba(5,4,20,.74);display:grid;place-items:center;padding:20px;}
.modal[hidden]{display:none;}
.mcard{position:relative;max-width:780px;max-height:90vh;overflow:auto;background:linear-gradient(180deg,#241e62,#151140);border:1.5px solid rgba(255,216,74,.45);border-radius:24px;padding:26px 32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.mcard h2{margin:0 44px 16px 0;font-size:clamp(21px,2.3vw,29px);line-height:1.15;color:var(--gold);}
.mclose{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:24px;font-weight:700;line-height:1;}
.mclose:hover{background:rgba(255,255,255,.25);}
.tl{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:9px;}
.tl li{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:baseline;font-size:clamp(14px,1.4vw,17px);line-height:1.4;font-weight:500;color:#e8e6ff;}
.tl .d{color:var(--gold);font-weight:700;} .tl b{color:#fff;}
.chain{margin:0;font-size:clamp(14px,1.35vw,17px);font-weight:500;line-height:1.55;color:#dcd9ff;border-top:1px solid rgba(255,255,255,.15);padding-top:16px;}
.chain b{color:var(--gold);font-weight:600;}
@media (max-width:900px){ .hero{grid-template-columns:1fr;gap:10px;} .heroimg{order:-1;padding:6px 110px 0;} .heroimg img{height:min(40vh,420px);}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:18px;} .card:nth-child(n){margin-bottom:0;} .thumb{height:auto;aspect-ratio:16/9;} .wrap{padding-bottom:24px;} }
@media (max-width:520px){ .wrap{padding:14px 14px 24px;} .cards{grid-template-columns:1fr;} .tl li{grid-template-columns:1fr;gap:0;} .heroimg{padding:6px 96px 0;} }

/* ---------------- player ---------------- */
#player{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ink);}
#stage{position:relative;overflow:hidden;background:#0f1a48;border-radius:12px 12px 0 0;}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
#bar{display:flex;align-items:center;gap:8px;padding:0 12px;background:#14102e;border-radius:0 0 12px 12px;}
#bar button.c{flex:none;border:0;border-radius:99px;background:rgba(255,255,255,.13);color:#fff;font-weight:600;font-size:var(--bf);height:calc(var(--bf)*2.1);padding:0 .85em;white-space:nowrap;display:inline-flex;align-items:center;gap:.4em;}
#bar button.c:hover{background:rgba(255,255,255,.25);}
#bar button.c svg{width:1.15em;height:1.15em;}
.side{position:absolute;top:50%;z-index:2;width:clamp(27px,3.5vw,49px);height:clamp(27px,3.5vw,49px);margin-top:calc(clamp(27px,3.5vw,49px)/-2);border:0;background:none;padding:0;
  color:#fff;opacity:.42;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));transition:opacity .2s,color .2s,transform .2s;}
.side svg{width:100%;height:100%;display:block;}
.side.l{left:1.2%;} .side.r{right:1.2%;}
.side:hover{opacity:.95;color:var(--gold);transform:scale(1.12);}
.side[hidden]{display:none;}
.side.pulse{opacity:1;color:var(--gold);animation:apulse 1.1s ease-in-out infinite;}
@keyframes apulse{50%{transform:scale(1.25);filter:drop-shadow(0 0 8px rgba(255,216,74,.95)) drop-shadow(0 2px 3px rgba(0,0,0,.6));}}
.arw{flex:none;border:0;background:none;padding:0;color:#fff;width:calc(var(--bf)*1.5);height:calc(var(--bf)*1.9);opacity:.85;transition:color .2s,transform .2s,opacity .2s;}
.arw svg{width:100%;height:100%;display:block;}
.arw:hover{color:var(--gold);opacity:1;transform:scale(1.15);}
.arw.off{visibility:hidden;}
.arw.pulse{color:var(--gold);opacity:1;animation:apulse 1.1s ease-in-out infinite;}
#dots{display:flex;gap:.45em;flex:none;}
.dot{width:calc(var(--bf)*.75);height:calc(var(--bf)*.75);border-radius:50%;border:2px solid rgba(255,255,255,.65);background:transparent;padding:0;cursor:pointer;}
.dot.done{background:rgba(255,255,255,.5);} .dot.on{background:var(--gold);border-color:var(--gold);}
#stepTitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:var(--bf);color:var(--cream);padding:0 .4em;}
#rot{display:none;color:var(--cream);font-size:15px;font-weight:600;margin-top:14px;text-align:center;}
@media (orientation:portrait) and (max-width:820px){ #rot{display:block;} }
</style>
</head>
<body>
<div id="player">
  <div id="stage"><canvas id="gl"></canvas><canvas id="ui"></canvas><button class="side l" id="sideL"></button><button class="side r" id="sideR"></button></div>
  <div id="bar">
    <button class="c" id="btnHome"></button>
    <button class="c" id="btnReplay"></button>
    <button class="c" id="btnPlay"></button>
    <button class="arw" id="barL"></button><div id="dots"></div><button class="arw" id="barR"></button>
    <div id="stepTitle"></div>
    <button class="c" id="btnMode"></button>
    <button class="c" id="btnSpeed"></button>
    <button class="c" id="btnSound" data-on="1"></button>
  </div>
  <div id="rot"></div>
</div>

<div id="home">
  <canvas id="sky"></canvas>
  <div class="wrap">
    <div class="top">
      <div class="kicker" id="kicker"></div>
      <div class="langsw" role="group" aria-label="Langue / Language">
        <button data-l="fr" class="on">Français</button><button data-l="en">English</button>
      </div>
    </div>
    <div class="hero">
      <div>
        <h1 id="hTitle"></h1>
        <p class="quote" id="hQuote"></p>
        <p class="intro" id="hIntro"></p>
        <button class="more" id="btnMore"></button>
      </div>
      <div class="heroimg"><div class="herofig"><div class="ground"></div><img id="heroImg" alt="" src="__HERO__"><span class="hl l" id="hl0"></span><span class="hl r" id="hl1"></span><span class="hl l" id="hl2"></span><span class="hl r" id="hl3"></span></div></div>
    </div>
    <div class="cards" id="cards"></div>
  </div>
  <div class="modal" id="moreBox" hidden><div class="mcard" role="dialog" aria-modal="true"><button class="mclose" id="btnMoreClose">×</button><h2 id="mTitle"></h2><ul class="tl" id="mList"></ul><p class="chain" id="hChain"></p></div></div>
</div>

__AUDIOS__
<script>__THREE__</script>
<script>__APP__</script>
</body>
</html>
